<body>

<h1>Exhale</h1>
<p class="lede">Face in the water. Say what the breath does, and what the hips do.</p>
<div id="trainers"></div>
<script src="../../assets/quiz.js"></script>
<script src="../../assets/toolpage.js"></script>
<script>
TEACH.trainer("trainers", {
  id: "s3-blow-again",
  title: "Blow again as the face returns",
  origin: { label: "Lesson 3 · Blow again as the face returns",
            href: "../lessons/0003-blow-again-as-the-face-returns.html" },
  blurb: "Eight cycles. A quiet face on the way back in does not count.",
  mount: function (stage) {
    stage.className = "quiz";
    return TEACH.quiz(stage, {
      items: [
        {
          id: "s3-when",
          prompt: "The inhale is done and the face is rolling back in. When does the next blow start?",
          choices: [
            "As the mouth meets the water, with no pause between.",
            "After a short hold, once the new breath feels settled.",
            "Only when the lungs are empty and you need air again."
          ],
          answer: 0,
          why: "The exchange does not stop. A pause with full lungs is a held breath, and a held breath ends in a gasp."
        },
        {
          id: "s3-quiet",
          prompt: "The face is back in and the water in front of your mouth is quiet. What is that pause?",
          choices: [
            "A rest. Full lungs are what keep the hips up.",
            "A hold. The old panic, one breath later than before.",
            "The drill. You blow only when the lungs are nearly empty."
          ],
          answer: 1,
          why: "Quiet water means the new air is being kept. Start the bubbles as the mouth goes under."
        },
        {
          id: "s3-count",
          prompt: "One of the eight cycles comes back in and waits before the bubbles. What do you do?",
          choices: [
            "Count it, because the face did return to the water.",
            "Skip it, and start the blow as the mouth goes under.",
            "Stand up, breathe, and begin the set from the wall."
          ],
          answer: 1,
          why: "The rep is bubbles on the way back in. A quiet return is a hold, and a hold does not count."
        }
      ]
    });
  }
});
TEACH.trainer("trainers", {
  id: "s2-one-goggle",
  title: "One goggle stays in",
  origin: { label: "Lesson 2 · One goggle stays in the water",
            href: "../lessons/0002-one-goggle-stays-in.html" },
  blurb: "Eight rolls. The one that brings both goggles out does not count.",
  mount: function (stage) {
    stage.className = "quiz";
    return TEACH.quiz(stage, {
      items: [
        {
          id: "s2-roll",
          prompt: "The lungs are nearly empty and you need air. What moves?",
          choices: [
            "The chin lifts until the mouth clears.",
            "The body rolls until one goggle stays.",
            "You stand and breathe beside the wall."
          ],
          answer: 1,
          why: "The mouth clears because the body rolled. A lifted chin is a different move, and it sinks the hips."
        },
        {
          id: "s2-both",
          prompt: "Both goggles come out of the water on the breath. What did the hips do?",
          choices: [
            "They stayed up because the lungs were full.",
            "They dropped because the head had come up.",
            "They stayed put because the head only turned."
          ],
          answer: 1,
          why: "Both goggles out means the chin came up. Chin up and hips down are the same motion."
        },
        {
          id: "s2-count",
          prompt: "One of the eight rolls brings both goggles out. What do you do with that one?",
          choices: [
            "Count it, because the mouth did clear.",
            "Skip it, and roll that breath again.",
            "Stop there and rest on the wall."
          ],
          answer: 1,
          why: "The rep is the goggle staying in, not the inhale. A lift does not count as the roll."
        }
      ]
    });
  }
});
TEACH.trainer("trainers", {
  id: "s1-exhale",
  title: "Where does the air go?",
  origin: { label: "Lesson 1 · Blow the air out before you need more",
            href: "../lessons/0001-blow-the-air-out.html" },
  blurb: "Four moments in the water. Pick the one that keeps the hips up.",
  mount: function (stage) {
    stage.className = "quiz";
    return TEACH.quiz(stage, {
      items: [
        {
          id: "s1-held",
          prompt: "You put your face in on a full breath and hold it until you need air. What happens next?",
          choices: [
            "You stay calm, because a full breath lasts longer.",
            "You have to lift your head and gulp, and your hips drop.",
            "The water holds you up as long as the breath is in."
          ],
          answer: 1,
          why: "A held breath ends in a gasp. Lifting the head to gasp sinks the hips, so the next breath is worse."
        },
        {
          id: "s1-blow",
          prompt: "Your face is in the water. Where does the exhale happen?",
          choices: [
            "Into the water, the whole time the face is down.",
            "After you lift your head, just before the inhale.",
            "Only through the mouth, once the mouth is clear of the water."
          ],
          answer: 0,
          why: "The blow happens face-down, so the inhale is one small turn instead of a rescue."
        },
        {
          id: "s1-chin",
          prompt: "You need air and you lift your chin toward the ceiling. What do the hips do?",
          choices: [
            "They stay up, because the lungs are full.",
            "They drop. The head and the hips trade places.",
            "Nothing. Breathing and body position are separate."
          ],
          answer: 1,
          why: "The body rotates around its center. Chin up is hips down. Turn to the side instead of lifting."
        },
        {
          id: "s1-turn",
          prompt: "The lungs are nearly empty and the face is still in. What is the inhale?",
          choices: [
            "Stand up, breathe, then start again from the beginning.",
            "A small turn until the mouth clears, one inhale, face back in.",
            "A longer hold, so you can reach the wall first."
          ],
          answer: 1,
          why: "Empty lungs plus a small turn is the whole skill. Standing up resets the panic instead of practicing past it."
        }
      ]
    });
  }
});
</script>
</body>
</html>
